# ==============================================================================
# 🚴 AMARELINHOS - NGINX REVERSE PROXY & PRODUCTION WEB SERVER CONFIGURATION
# ==============================================================================
# Caminho de instalação: /etc/nginx/sites-available/amarelinhos
# Link simbólico: sudo ln -s /etc/nginx/sites-available/amarelinhos /etc/nginx/sites-enabled/
# ==============================================================================

# Redirecionamento HTTP (Porta 80) para HTTPS (Porta 443)
server {
    listen 80;
    listen [::]:80;
    server_name amarelinhos.com.br www.amarelinhos.com.br _;

    # Permite validação do Certbot para renovação automática do SSL
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redireciona todo o tráfego HTTP para HTTPS seguro
    location / {
        return 301 https://$host$request_uri;
    }
}

# Servidor HTTPS Seguro (Porta 443)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name amarelinhos.com.br www.amarelinhos.com.br;

    # Certificados SSL emitidos pelo Certbot (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/amarelinhos.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/amarelinhos.com.br/privkey.pem;

    # Parâmetros modernos de segurança SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Cabeçalhos de Segurança HTTP (HSTS, Anti-Clickjacking, MIME Sniffing)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Compressão Gzip para carregamento ultra-rápido no celular (3G/4G)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    # Limite de tamanho de upload (necessário para fotos de classificados e produtos)
    client_max_body_size 25M;

    # Raiz dos arquivos estáticos compilados
    root /var/www/amarelinhos/dist;
    index index.html;

    # Cache de longa duração para assets com hash estático (CSS, JS, Imagens)
    location ~* \.(?:css|js|woff2?|svg|gif|png|jpe?g|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri @backend;
    }

    # Proxy reverso para o servidor Node.js (Express / API Health)
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # Fallback para Single Page Application (SPA / React)
    location / {
        try_files $uri $uri/ /index.html @backend;
    }

    location @backend {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
