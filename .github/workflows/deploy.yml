name: CI/CD Pipeline - Amarelinhos Ciclismo

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Código-Fonte
      uses: actions/checkout@v4

    - name: Configurar Node.js 20 LTS
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Instalar Dependências
      run: npm ci

    - name: Verificação de Tipos TypeScript (Lint)
      run: npm run lint

    - name: Compilar Frontend & Servidor Node.js
      run: npm run build

    - name: Validar Saída de Produção
      run: |
        test -f dist/index.html || exit 1
        test -f dist/server.js || exit 1
        echo "✓ Build de produção validado com sucesso!"
